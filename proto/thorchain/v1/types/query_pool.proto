syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "gogoproto/gogo.proto";

option (gogoproto.marshaler_all) = true;

message QueryPoolRequest {
  string asset = 1;
  string height = 2;
}

message QueryPoolResponse {
  string asset = 1 [ (gogoproto.jsontag) = "asset" ];
  string short_code = 2;
  string status = 3 [ (gogoproto.jsontag) = "status" ];
  int64 decimals = 4;
  string pending_inbound_asset = 5
      [ (gogoproto.jsontag) = "pending_inbound_asset" ];
  string pending_inbound_rune = 6
      [ (gogoproto.jsontag) = "pending_inbound_rune" ];
  string balance_asset = 7 [ (gogoproto.jsontag) = "balance_asset" ];
  string balance_rune = 8 [ (gogoproto.jsontag) = "balance_rune" ];
  // the USD (TOR) price of the asset in 1e8
  string asset_tor_price = 9 [ (gogoproto.jsontag) = "asset_tor_price" ];
  // the total pool units, this is the sum of LP and synth units
  string pool_units = 10 [ (gogoproto.jsontag) = "pool_units" ];
  // the total pool liquidity provider units
  string LP_units = 11 [ (gogoproto.jsontag) = "LP_units" ];
  // the total synth units in the pool
  string synth_units = 12 [ (gogoproto.jsontag) = "synth_units" ];
  // the total supply of synths for the asset
  string synth_supply = 13 [ (gogoproto.jsontag) = "synth_supply" ];
  // the balance of L1 asset deposited into the Savers Vault
  string savers_depth = 14 [ (gogoproto.jsontag) = "savers_depth" ];
  // the number of units owned by Savers
  string savers_units = 15 [ (gogoproto.jsontag) = "savers_units" ];
  // the filled savers capacity in basis points, 4500/10000 = 45%
  string savers_fill_bps = 16 [ (gogoproto.jsontag) = "savers_fill_bps" ];
  // amount of remaining capacity in asset
  string savers_capacity_remaining = 17
      [ (gogoproto.jsontag) = "savers_capacity_remaining" ];
  // whether additional synths cannot be minted
  bool synth_mint_paused = 18 [ (gogoproto.jsontag) = "synth_mint_paused" ];
  // the amount of synth supply remaining before the current max supply is
  // reached
  string synth_supply_remaining = 19
      [ (gogoproto.jsontag) = "synth_supply_remaining" ];
  // the depth of the derived virtual pool relative to L1 pool (in basis points)
  string derived_depth_bps = 23 [ (gogoproto.jsontag) = "derived_depth_bps" ];
  // whether trading is halted
  bool trading_halted = 24 [ (gogoproto.jsontag) = "trading_halted" ];
  // 24h trading volume rune
  string volume_rune = 25 [ (gogoproto.jsontag) = "volume_rune" ];
  // 24h trading volume asset
  string volume_asset = 26 [ (gogoproto.jsontag) = "volume_asset" ];
  // cumulative RUNE deposited by POL Reserve into this pool
  string pol_reserve_rune_deposited = 27
      [ (gogoproto.jsontag) = "pol_reserve_rune_deposited" ];
  // rolling liquidity fees accumulated (in RUNE) since the last pool cycle
  // reset; used as the numerator of the POL Reserve deployment score
  string rolling_pool_liquidity_fee_rune = 28
      [ (gogoproto.jsontag) = "rolling_pool_liquidity_fee_rune" ];
  // Liquidity Unit Value Index as the chain values a pool unit:
  // sqrt(balance_asset * balance_rune) / pool_units (synth-unit clamp included)
  string luvi = 29 [ (gogoproto.jsontag) = "luvi" ];
  // LP equity net of the synth liability, in sqrt(asset * rune) units:
  // sqrt(balance_asset * balance_rune) * (2 * balance_asset - synth_supply) /
  // (2 * balance_asset); zero or negative when synth_overhang is true
  string lp_equity = 30 [ (gogoproto.jsontag) = "lp_equity" ];
  // lp_equity / LP_units; equals luvi (up to rounding) unless synth_overhang
  string lp_equity_per_unit = 31 [ (gogoproto.jsontag) = "lp_equity_per_unit" ];
  // synth supply relative to twice the asset depth, in basis points
  string synth_per_pool_depth_bps = 32
      [ (gogoproto.jsontag) = "synth_per_pool_depth_bps" ];
  // whether synth supply is at or above twice the asset depth; synth units are
  // clamped and LP units can redeem almost nothing while this is true
  bool synth_overhang = 33 [ (gogoproto.jsontag) = "synth_overhang" ];
  // LUVI accumulator, advanced once per block (see PoolLuvi); absent until the
  // pool has been observed at the end of a block.
  // accumulated change in hedged LP equity G, in sqrt(asset * rune) units
  string luvi_g = 34;
  // accumulated synth repricing term C of LUVI*
  string luvi_c = 35;
  // synth-aware index LUVI* = lp_equity_per_unit + luvi_c as of luvi_height;
  // only meaningful when synth_overhang is false
  string luvi_star = 36;
  // the last block's change in G divided by the previous sqrt(asset * rune)
  string luvi_last_normalized_delta_g = 37;
  // height of the last accumulator step
  int64 luvi_height = 38;
  // Fields 40-45 value the pool's LP side at the oracle price P of the asset
  // in RUNE (oracle USD price of the asset / oracle USD price of RUNE) instead
  // of the pool's own price. A layer-1 swap never lowers
  // sqrt(balance_asset * balance_rune) (fees raise it), so a layer-1 swap or
  // sandwich cannot push the fair value down. Synth mints and burns change
  // balance_rune and synth_supply with balance_asset fixed, so they move it
  // either way unless P equals the pool price. They are only set when the
  // oracle has a price for both the asset ticker and RUNE at this height (the
  // price store holds only the current block's quorum prices).
  //
  // fair LP-side value per LP unit, in RUNE:
  // (2 * sqrt(balance_asset * balance_rune * P) - synth_supply * P) / LP_units,
  // clamped at zero
  string lp_unit_fair_value_rune = 40;
  // lp_unit_fair_value_rune / P, in the asset
  string lp_unit_fair_value_asset = 41;
  // spot LP-side value per LP unit, in RUNE:
  // (2 * balance_rune - synth_supply * balance_rune / balance_asset) /
  // LP_units, clamped at zero
  string lp_unit_spot_value_rune = 42;
  // (lp_unit_spot_value_rune - lp_unit_fair_value_rune) /
  // lp_unit_fair_value_rune in basis points: how far the pool price has been
  // pushed from the oracle; unset when lp_fair_value_overhang is true
  string lp_fair_spot_deviation_bps = 43;
  // the oracle price P of one unit of the asset in RUNE
  string fair_value_oracle_price_rune = 44;
  // whether the synth liability is at or above the pool's fair value, so the
  // LP side is worth nothing at the oracle price
  bool lp_fair_value_overhang = 45;
}

message QueryPoolsRequest { string height = 1; }

message QueryPoolsResponse { repeated QueryPoolResponse pools = 1; }
