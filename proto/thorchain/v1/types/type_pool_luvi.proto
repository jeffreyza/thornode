syntax = "proto3";
package types;

option go_package = "gitlab.com/thorchain/thornode/v3/x/thorchain/types";

import "common/common.proto";
import "gogoproto/gogo.proto";

// PoolLuvi is a pool's LUVI accumulator, advanced once per block at the end
// of EndBlock (see x/thorchain/types/type_luvi.go). It holds the last
// observed state, so the next step can be computed, and the raw accumulators
// C and G at full precision (10^36 fixed point).
message PoolLuvi {
  common.Asset asset = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "gitlab.com/thorchain/thornode/v3/common.Asset"
  ];
  int64 height = 2;
  string balance_rune = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string balance_asset = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string lp_units = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string synth_supply = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string pool_units = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  // accumulated C (synth repricing term of LUVI*), 10^36 fixed point
  string raw_c = 8 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // accumulated G (hedged LP equity change), 10^36 fixed point
  string raw_g = 9 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // the block's normalized change in G (dG / sqrt(A*R) of the previous state)
  string last_normalized_delta_g = 10 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}
