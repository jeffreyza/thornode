      wget -q https://github.com/docker/compose/releases/download/v2.28.1/docker-compose-linux-x86_64 -O "$PLUGIN"
      echo "5b480d4f9e3517b375f0fbb781b39c63cec934f44b13c43b8f1d0f22bf6de8c3  $PLUGIN" | sha256sum -c -
      chmod +x "$PLUGIN"
