lint:
  tags: !reference [.small-runner, tags]
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - if: $CI_COMMIT_BRANCH == "stagenet"
      when: never
    - if: $CI_COMMIT_BRANCH == "chainnet"
      when: never
    - if: $CI_COMMIT_BRANCH == "mainnet"
      when: never
    - if: $CI == "true"
      when: on_success
  stage: test
  needs: []
  # No resource_group: concurrent runs share /trunk-cache safely once it is warm
  # (4 at once on one cache, 4/4 clean), and scripts/trunk-ci.sh retries the
  # tool install race a cold cache can hit. The old global lock made lint wait
  # 25 min at p75 and 64 at p90 (2026-09-22..29), and did not prevent the trunk
  # internal errors it was added for: all 20 that week ran with no other lint.
  # make lint-ci checks the whole tree rather than a diff against the merge
  # base, so the job keeps the shallow clone (the full one cost 44s at p50 and
  # 148s at p90); lint-tokens.bash fetches develop's tip for its comparison.
  variables:
    XDG_CACHE_HOME: /trunk-cache
    PKGS: jq
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
  script:
    - make lint-ci

