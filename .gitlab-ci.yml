image: golang:1.26.10

# Retry jobs that failed for infrastructure reasons, never on script_failure.
# Server-side execution timeouts are left out: those jobs really ran too long.
# Exit code 75 (EX_TEMPFAIL) is how our own scripts flag an infrastructure
# failure the runner cannot classify, e.g. the dind service never came up.
# A job-level `retry:` replaces this entirely, so jobs that set their own must
# repeat these reasons.
default:
  # Auto-cancel leaves a pipeline alone once any non-interruptible job has
  # started, so without this a superseded MR pipeline always ran to the end.
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
      - stuck_pending_with_matching_runners
      - no_updates_running
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure
    exit_codes:
      - 75

# MR pipelines: a newer push cancels the superseded pipeline, and the first
# failed job cancels the rest of its pipeline. Retries and allow_failure jobs
# don't count as failed for this. Tag and protected-branch pipelines publish
# images and docs, so they always run to completion.
workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
      auto_cancel: &no_auto_cancel
        on_new_commit: none
        on_job_failure: none
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      auto_cancel: *no_auto_cancel
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  # Runner tag for the short jobs (see .small-runner). A project CI/CD variable
  # overrides this, so SMALL_RUNNER_TAG=thorchain sends them back to any runner
  # without an MR if the small runners are down.
  SMALL_RUNNER_TAG: small
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: $DOCKER_TLS_CERTDIR/client
  GOMODCACHE: /go-mod-cache
  GOCACHE: /go-build-cache
  # tss-lib-private is a private GitLab subgroup repo; skip proxy.golang.org / sumdb
  # and resolve directly so the per-job git auth below takes effect.
  GOPRIVATE: gitlab.com/thorchain/tss/tss-lib-private.git
  # Download the toolchain pinned in go.mod (toolchain go1.26.10) when an image
  # ships an older Go (the CI tools image's Go is a floor, not a pin).
  GOTOOLCHAIN: auto
  SAST_EXCLUDED_ANALYZERS: eslint,bandit,semgrep
  # Published by build-ci-tools-image; see ci/Dockerfile.ci-tools before bumping.
  # Pinned to the digest that job printed ("Pin jobs to: ..."): any Developer's
  # CI_JOB_TOKEN can push to this registry, so the tag alone is not trusted.
  CI_TOOLS_IMAGE: $CI_REGISTRY_IMAGE/ci/tools:2@sha256:29b5fe763a4b6fd27e5f7a19c8744e1f9dc39870dcb6ac571661d44cbb5d0e7c
  # Let the runner retry the stages it owns. A failed source fetch ("fetch-pack:
  # unexpected disconnect", "GitLab is currently unable to handle this request
  # due to load") is reported as script_failure, so `retry:` cannot catch it.
  GET_SOURCES_ATTEMPTS: 3
  ARTIFACT_DOWNLOAD_ATTEMPTS: 3
  RESTORE_CACHE_ATTEMPTS: 3
  EXECUTOR_JOB_SECTION_ATTEMPTS: 3
  # Shallow clone. The project default is a full clone (941MB of history), which
  # averaged 78s per job, about 14% of all runner time on 2026-09-22..29. Only
  # fork needs history (a merge base with the target branch) and sets
  # GIT_DEPTH 0 itself; secret_detection sets its own 50 in the template.
  GIT_DEPTH: "20"
  SAST_EXCLUDED_PATHS: spec, test, tests, tmp, .cache

# The dind jobs run in the prebuilt tools image (ci/Dockerfile.ci-tools)
# instead of installing packages with `apk add` on every job.
.use_dind: &use_dind
  image: $CI_TOOLS_IMAGE
  services:
    - docker:28.5.2-dind

# Wait for the dind service before the first docker command. If it never
# answers ("dial tcp ...:2376: connect: no route to host"), exit 75 so the
# default retry picks the job up instead of failing it as a script error.
# https://gitlab.com/gitlab-org/gitlab-runner/-/issues/27384#note_497228752
.wait-for-dind:
  before_script:
    - |
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i + 1))
        if [ "$i" -ge 60 ]; then
          echo "dind service at $DOCKER_HOST did not answer within 60s"
          docker info || true
          exit 75
        fi
        echo "Waiting for docker to start"
        sleep 1
      done

# Registry setup for dind jobs, after .wait-for-dind:
# - Log in to Docker Hub for the higher pull rate limit. The login is only a
#   rate-limit courtesy, so after 3 attempts carry on anonymously rather than
#   fail (2026-09-14..28: 19 jobs died on this login alone).
# - Export DOCKER_MIRROR, the group dependency proxy prefix, for docker builds
#   and in-dind pulls. It stays unset when the pipeline user cannot use the
#   proxy (users outside the thorchain group get "manifest unknown" and fall
#   back to Docker Hub), so never use it for job or service images.
.dind-registries:
  before_script:
    - |
      for i in 1 2 3; do
        echo "$DOCKER_HUB_PASSWD" | docker login -u thornode --password-stdin && break
        if [ "$i" = 3 ]; then
          echo "Docker Hub login failed 3 times; continuing with anonymous pulls"
        else
          sleep 10
        fi
      done
    - |
      if [ -n "$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX" ]; then
        export DOCKER_MIRROR="${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/"
        if ! echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin; then
          echo "Dependency proxy login failed; falling back to Docker Hub"
          unset DOCKER_MIRROR
        # imagetools resolves the manifest in ~1s; `docker manifest inspect`
        # took 16-32s against the dependency proxy in every dind job.
        elif ! docker buildx imagetools inspect "${DOCKER_MIRROR}golang:1.26.10" >/dev/null 2>&1; then
          echo "Dependency proxy missing golang:1.26.10; falling back to Docker Hub"
          unset DOCKER_MIRROR
        fi
      fi

# Pull proto-builder from this project's registry, where mirror-ci-images
# copies it on protected branches, instead of ghcr.io (2026-09-14..28: 55 proto
# job failures on ghcr.io token and manifest timeouts). Falls back to ghcr.io
# when the mirror lacks the version the Makefile pins, e.g. in the MR that
# bumps protoVer. Any Developer's CI_JOB_TOKEN can push to this registry, so
# the image is always pulled by the Makefile's protoDigest, never by tag alone.
.proto-builder-image:
  before_script:
    - |
      PROTO_VER=$(sed -n 's/^protoVer=//p' Makefile)
      PROTO_DIGEST=$(sed -n 's/^protoDigest=//p' Makefile)
      PROTO_MIRROR="$CI_REGISTRY_IMAGE/ci/proto-builder"
      if docker pull -q "$PROTO_MIRROR:$PROTO_VER@$PROTO_DIGEST" >/dev/null 2>&1; then
        export PROTO_BUILDER_REPO="$PROTO_MIRROR"
      else
        echo "$PROTO_MIRROR:$PROTO_VER@$PROTO_DIGEST unavailable; pulling proto-builder from ghcr.io"
      fi

# buf.build's edge answers the Finland runner's egress IP with HTTP 403, so the
# BUF_PROXY CI/CD variable routes buf through a proxy (see the Makefile). That
# proxy only works from Finland: from any other runner it refuses the
# connection and buf fails with "the server hosted at that remote is
# unavailable". Keep BUF_PROXY only when this runner cannot reach api.buf.build
# itself (HTTP 403 or no answer). Any other status, including the 404 its root
# returns, means direct access works. Needs wget and sed (busybox has both).
# wget exits non-zero on every outcome that matters here (403, 404, no
# answer), and job scripts run with errexit and pipefail, so its status is
# discarded and only the HTTP status line it printed is used.
.buf-egress:
  before_script:
    - |
      if [ -n "${BUF_PROXY:-}" ]; then
        BUF_STATUS=$( { wget -q -S -T 10 -O /dev/null https://api.buf.build/ 2>&1 || true; } | sed -n 's/^ *HTTP\/[0-9.]* \([0-9]*\).*/\1/p' | tail -1)
        if [ -n "$BUF_STATUS" ] && [ "$BUF_STATUS" != 403 ]; then
          echo "api.buf.build reachable directly (HTTP $BUF_STATUS); not using BUF_PROXY"
          unset BUF_PROXY
        else
          echo "api.buf.build blocked or unreachable directly (${BUF_STATUS:-no response}); using BUF_PROXY"
        fi
      fi

# Authenticate git to gitlab.com so `go mod download` can fetch the private
# module tss-lib-private, and export GO_PRIVATE_GIT_CREDENTIAL for docker
# builds. Prefers the TSS_LIB_PRIVATE_READ_TOKEN CI/CD variable over
# CI_JOB_TOKEN, which only works when the pipeline user can read tss-lib-private.
# Include with `!reference [.go-private-auth, before_script]` in any job that
# resolves Go modules; jobs that build in dind also set
# GO_PRIVATE_AUTH_REQUIRED=1 to fail fast when no credential works. Needs git.
.go-private-auth:
  before_script:
    - . ./scripts/ci-go-private-auth.sh

# Content-derived mtimes for the checkout (scripts/ci-stable-mtimes.sh), so
# go test reuses cached results for packages whose code and test inputs did
# not change; a fresh clone otherwise invalidates every package that reads a
# file. Include with `!reference [.stable-mtimes, before_script]` in jobs that
# run go test.
.stable-mtimes:
  before_script:
    - ./scripts/ci-stable-mtimes.sh

# Every job except the sim and the image builds runs on a runner tagged
# `small`, with small slots (today one: hedwig-small). The project had 7 slots
# on 2026-09-30 (Finland capped at 4, hedwig 3), and sims held 2-4 of them for
# 30-45 min each, so 1-5 min gate jobs queued 8-29 min each, one after another. A small slot is 6 CPU / 24 GiB (lint
# and the race tests need the memory) with a 4 CPU / 8 GiB dind service for
# generate and the proto jobs. test-simulation, the build jobs and the image
# mirror stay untagged and keep the sim-sized slots on Finland and hedwig.
.small-runner:
  tags:
    - $SMALL_RUNNER_TAG

# What test-simulation and test-regression wait for. On 2026-09-15..29 these
# jobs caught 116 of the 122 pipelines that failed a check before the sim
# (lint 40, generate 39, proto 37, unit-tests 14); in 33 of them lint was the
# only failing check. With no trunk lock, lint starts with the pipeline and
# takes about as long as unit-tests, so gating on it costs little and keeps a
# lint-only failure from spending a sim. `optional` covers pipelines where
# rules leave a job out (lint on deployment branches, unit-tests on some merge
# trains). No artifacts are needed from them.
.long-test-gate:
  needs:
    - job: lint
      optional: true
      artifacts: false
    - job: generate
      optional: true
      artifacts: false
    - job: proto-check-formatting
      optional: true
      artifacts: false
    - job: proto-lint
      optional: true
      artifacts: false
    - job: proto-check-breaking
      optional: true
      artifacts: false
    - job: unit-tests
      optional: true
      artifacts: false
    - job: test-mainnet-monero
      optional: true
      artifacts: false
    - job: test-simulation-unit
      optional: true
      artifacts: false

# Install $PKGS from the distro mirror. A DNS blip on the runner ("Temporary
# failure resolving 'deb.debian.org'") only warns in `apt-get update` and then
# fails the install as a script error, so retry and exit 75 if the mirror stays
# unreachable. Include with `!reference [.pkg-install, before_script]`.
.pkg-install:
  before_script:
    - |
      for i in 1 2 3; do
        if command -v apk >/dev/null; then
          apk add --no-cache $PKGS && break
        else
          apt-get update && apt-get install -y --no-install-recommends $PKGS && break
        fi
        if [ "$i" = 3 ]; then
          echo "package mirror unreachable, treating as an infrastructure failure"
          exit 75
        fi
        sleep 15
      done

# Docker CLI, compose and buildx for a dind job on a Debian image, pinned to the
# versions docker:28.5.2 ships, from Docker's apt repository (not Docker Hub).
# Include before .wait-for-dind; exits 75 if the repository stays unreachable.
.docker-cli-apt:
  before_script:
    - |
      . /etc/os-release
      install -m 0755 -d /etc/apt/keyrings
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $VERSION_CODENAME stable" \
        > /etc/apt/sources.list.d/docker.list
      for i in 1 2 3; do
        curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc &&
          apt-get update &&
          apt-get install -y --no-install-recommends $PKGS \
            docker-ce-cli="5:28.5.2-1~debian.12~$VERSION_CODENAME" \
            docker-compose-plugin="2.40.3-1~debian.12~$VERSION_CODENAME" \
            docker-buildx-plugin="0.29.1-1~debian.12~$VERSION_CODENAME" && break
        if [ "$i" = 3 ]; then
          echo "Docker apt repository unreachable, treating as an infrastructure failure"
          exit 75
        fi
        sleep 15
      done

# Jobs start from `needs:`, not from stage order. With stage order the
# simulation started a median 27 min after the pipeline (p90 117 min), held back
# by whichever protobuf or test job finished last. Checks that need nothing
# start at once. test-simulation and test-regression wait only for the checks
# that catch most bad branches (.long-test-gate), so a branch that fails those
# does not also spend runner time on a sim. The build jobs keep their existing
# stage order and publication rules: `build` comes before `long-test`, and the
# build rules use `when: always`, so images do not wait for the sim, regression
# or a failed check.
stages:
  - .pre
  - fork
  - protobuf
  - test
  - build
  - long-test

# Fork MR validation job
# This job runs for all fork MRs and implements two main functions:
# 1. Skip CI validation if only documentation/config text files are changed
# 2. Validate that non-text changes have successful CI in the source project
#
# This consolidates the logic that was previously split between text_files_check
# and fork jobs, fixing a timing issue where GitLab CI rule evaluation happened
# before dotenv artifacts were available.
fork:
  tags: !reference [.small-runner, tags]
  stage: fork
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: always
  variables:
    PKGS: git jq
    GIT_DEPTH: "0"
  before_script:
    - !reference [.pkg-install, before_script]
  script:
    - |
      # First, check if only text files are changed in this fork MR
      echo "Checking if only text files are changed..."

      # Fetch the target branch to compare
      git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME

      # Get list of changed files in the merge request
      CHANGED_FILES=$(git diff --name-only origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD)
      echo "Changed files:"
      echo "$CHANGED_FILES"

      # Check if all changed files are text files (md, json, yaml, yml)
      # Exclude specific files that are not considered text-only changes
      EXCLUDED_FILES=".gitlab-ci.yml .trunk/trunk.yaml .trunk/configs/analyzers.yml .trunk/configs/.golangci.yaml .trunk/configs/.markdownlint.yaml .trunk/configs/.yamllint.yaml build/docker/docker-compose.yml build/docker/docker-compose.xmr-chainnet.yml build/docker/docker-compose.xmr-stagenet.yml config/default.yaml openapi/openapi.yaml"
      TEXT_ONLY=true
      if [ -n "$CHANGED_FILES" ]; then
        for file in $CHANGED_FILES; do
          if echo "$EXCLUDED_FILES" | grep -q "$file" || ! echo "$file" | grep -q '\.\(md\|json\|yaml\|yml\)$'; then
            echo "Non-text file found: $file"
            TEXT_ONLY=false
            break
          fi
        done
      else
        # No files changed, consider it as non-text
        TEXT_ONLY=false
      fi

      echo "Detected text files only: $TEXT_ONLY"

      # If only text files are changed, skip the fork validation
      if [ "$TEXT_ONLY" = "true" ]; then
        echo "Only text files detected in fork MR. Skipping fork validation."
        echo "Fork MR with text-only changes is allowed to proceed without CI validation."
        exit 0
      fi

      # Continue with fork validation for non-text changes
      echo "Non-text files detected. Proceeding with fork validation..."
      echo Project ID: $CI_PROJECT_ID
      echo Merge project ID: $CI_MERGE_REQUEST_PROJECT_ID
      COMMIT_SHA=${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}
      echo Commit SHA: $COMMIT_SHA
      if ! curl https://gitlab.com/api/v4/projects/$CI_MERGE_REQUEST_PROJECT_ID/pipelines?sha=$COMMIT_SHA | tee /dev/stderr | jq -e '.[]|select(.status=="success")'; then
        echo
        echo
        echo '1. Ensure the following passes locally: `make generate lint test test-regression test-simulation`'
        echo '2. Have a contributor run `make gitlab-trigger-ci`.'
        echo '3. Re-run this job.'
        exit 1
      fi

generate:
  tags: !reference [.small-runner, tags]
  rules: &rules
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - if: $CI == "true"
      when: on_success
  # buf resolves BSR deps at job runtime and intermittently 403s under rate
  # limiting; without this a transient window blocks the whole pipeline, and
  # merge-train jobs cannot be retried by hand.
  retry: &buf_retry
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
      - stuck_pending_with_matching_runners
      - no_updates_running
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure
      - script_failure
  stage: protobuf
  needs: []
  <<: *use_dind
  before_script:
    - !reference [.wait-for-dind, before_script]
    - !reference [.go-private-auth, before_script]
    - !reference [.dind-registries, before_script]
    - !reference [.proto-builder-image, before_script]
    - !reference [.buf-egress, before_script]
  script:
    - |
      export PATH="$PATH:/root/go/bin"
      make generate
      ./scripts/lint-generated.bash

unit-tests:
  tags: !reference [.small-runner, tags]
  variables:
    PKGS: python3
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  stage: test
  needs: []
  coverage: /total:\s+\(statements\)\s+(\d+.\d+\%)/
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
    - !reference [.stable-mtimes, before_script]
    - go install github.com/boumenot/gocover-cobertura@v1.4.0
    - go install gotest.tools/gotestsum@v1.13.0
  script:
    # Fails if a *_test.go file is compiled by no CI test configuration.
    - python3 scripts/test-quality-inventory.py --check-selection --output test-quality-reports/root-mocknet/source-inventory.json
    - make test-coverage-sum
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ] && ! git cat-file -e "${CI_MERGE_REQUEST_DIFF_BASE_SHA}^{commit}" 2>/dev/null; then
        timeout 30 git fetch --no-tags --depth=1 origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || true
      fi
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ] && git cat-file -e "${CI_MERGE_REQUEST_DIFF_BASE_SHA}^{commit}" 2>/dev/null; then
        python3 scripts/test-quality-fetch-baseline.py test-quality-reports/root-mocknet/baseline-coverage.txt
        baseline_arg=
        if [ -f test-quality-reports/root-mocknet/baseline-coverage.txt ]; then
          baseline_arg='--baseline-profile test-quality-reports/root-mocknet/baseline-coverage.txt'
        fi
        python3 scripts/test-quality-coverage.py --profile coverage.txt --base-ref "$CI_MERGE_REQUEST_DIFF_BASE_SHA" $baseline_arg --output test-quality-reports/root-mocknet/changed-coverage.json
      else
        mkdir -p test-quality-reports/root-mocknet
        echo '{"baseline_available":false,"reason":"MR base commit unavailable; changed coverage comparison not run"}' > test-quality-reports/root-mocknet/changed-coverage.json
      fi
  artifacts:
    when: always
    reports:
      junit:
        - report.xml
        - test-quality-reports/network-*/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage*
      - report.xml
      - network-specific.log
      - test-quality-reports/root-mocknet/
      - test-quality-reports/network-*/

# The fail-closed Monero daemon check skips in the normal mocknet suite.
test-mainnet-monero:
  tags: !reference [.small-runner, tags]
  variables:
    PKGS: python3
  rules: *rules
  stage: test
  needs: []
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
    - !reference [.stable-mtimes, before_script]
  script:
    - make test-quality-mainnet
  artifacts:
    when: always
    reports:
      junit: test-quality-reports/root-mainnet-monero/junit.xml
    paths:
      - test-quality-reports/root-mainnet-monero/

# The tests in `make test-utxo-daemons` skip in unit-tests and
# test-simulation-unit because they need a real daemon. Here each daemon is
# fresh and owned by this job, so the tests cannot spend funds a simulation
# needs. zebrad is copied out of the mocknet Zebra image, so the ZEC signing
# tests validate against the same official binary mocknet runs. The default
# trixie Go image is required: zebrad 6.4.2 links against trixie's glibc, which
# rules out the Alpine tools image and the bookworm docker-ce packages.
test-utxo-daemons:
  tags: !reference [.small-runner, tags]
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  stage: test
  needs: []
  timeout: 30m
  variables:
    PKGS: python3 docker-cli
    # Not ZEBRA_*: zebrad reads ZEBRA_<FIELD> env vars as config overrides, and
    # the signing tests' zebrad inherits the job environment, so ZEBRA_IMAGE
    # makes it reject the unknown config field `image`.
    ZEC_IMAGE: zfnd/zebra:6.4.2
    DOGE_IMAGE: registry.gitlab.com/thorchain/devops/node-launcher:dogecoin-daemon-1.14.9
  services:
    - docker:28.5.2-dind
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.wait-for-dind, before_script]
    - !reference [.go-private-auth, before_script]
    - !reference [.stable-mtimes, before_script]
    - !reference [.dind-registries, before_script]
  script:
    # .dind-registries probes the mirror with buildx, which docker-cli lacks,
    # so try the dependency proxy with a plain pull before Docker Hub.
    - |
      if [ -n "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX:-}" ] &&
         docker pull -q "$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/$ZEC_IMAGE"; then
        ZEC_IMAGE="$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/$ZEC_IMAGE"
      else
        docker pull -q "$ZEC_IMAGE" || exit 75
      fi
      docker pull -q "$DOGE_IMAGE" || exit 75
    - |
      zebra=$(docker create "$ZEC_IMAGE")
      docker cp "$zebra:/usr/local/bin/zebrad" /usr/local/bin/zebrad
      docker rm "$zebra"
      zebrad --version
    # The same images, entrypoints and settings as the mocknet compose services.
    - |
      mocknet="$CI_PROJECT_DIR/build/docker/mocknet"
      docker run -d --name dogecoin --user root -p 18332:18332 -v "$mocknet:/mocknet" \
        -e BLOCK_TIME=1 -e DOGE_MASTER_ADDR=mnaioCtEGdw6bd6rWJ13Mbre1kN5rPa2Mo \
        --entrypoint /mocknet/dogecoin-entrypoint.sh "$DOGE_IMAGE"
      docker run -d --name zcash -p 18232:18232 -e BLOCK_TIME=1 \
        -v "$mocknet/zcash/zebrad.toml:/etc/zebrad.toml" -v "$mocknet/zcash/entrypoint.sh:/etc/entrypoint.sh" \
        --entrypoint /etc/entrypoint.sh "$ZEC_IMAGE"
    # Wait for the initial blocks each entrypoint mines to the master address.
    - |
      height() {
        curl -s --max-time 5 "$@" -H 'Content-Type: application/json' \
          -d '{"jsonrpc":"1.0","id":1,"method":"getblockcount","params":[]}' |
          python3 -c 'import json, sys; print(json.load(sys.stdin)["result"])' 2>/dev/null || echo 0
      }
      for i in $(seq 1 150); do
        doge=$(height --user thorchain:password http://docker:18332/)
        zec=$(height http://docker:18232/)
        [ "$doge" -ge 1000 ] && [ "$zec" -gt 400 ] && break
        if [ "$i" = 150 ]; then
          echo "daemons not ready after 5 minutes: dogecoin=$doge zcash=$zec"
          exit 1
        fi
        sleep 2
      done
      echo "dogecoin height $doge, zcash height $zec"
    - |
      export ZEC_DAEMON=/usr/local/bin/zebrad
      export DOGE_SIM_INTEGRATION_RPC_URL=http://thorchain:password@docker:18332
      export ZEC_SIM_INTEGRATION_RPC_URL=http://docker:18232
      make test-utxo-daemons
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        mkdir -p logs
        docker logs dogecoin > logs/dogecoin.log 2>&1 || true
        docker logs zcash > logs/zcash.log 2>&1 || true
      fi
  artifacts:
    when: always
    reports:
      junit:
        - test-quality-reports/utxo-daemons-zebra/junit.xml
        - test-quality-reports/utxo-daemons-simulation/junit.xml
    paths:
      - test-quality-reports/utxo-daemons-*/
      - logs/

