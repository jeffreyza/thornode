proto-check-breaking:
  tags: !reference [.small-runner, tags]
  # Compare MR protos with their target branch; other runs compare with develop.
  # The long-lived deployment branches (mainnet/stagenet/chainnet) intentionally
  # lag develop's schema and will report upstream-only additions as "deletions".
  # On those branches the result is informational, not gating; on MRs and
  # develop itself the check must block.
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^(mainnet|stagenet|chainnet)$/
      when: on_success
      allow_failure: true
    - if: $CI == "true"
      when: on_success
  retry: *buf_retry
  stage: protobuf
  needs: []
  <<: *use_dind
  before_script:
    - !reference [.wait-for-dind, before_script]
    - !reference [.proto-builder-image, before_script]
    - !reference [.buf-egress, before_script]
  script:
    - make proto-check-breaking

