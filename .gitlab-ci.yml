    # project uses the fork's .gitlab-ci.yml and receives every unprotected
    # project variable, so review the fork's diff before running it.
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - changes:
        paths:
          - bifrost/tss/go-tss/**/*
          - bifrost/tss/*.go
          - bifrost/tss/curvelock/**/*
          - bifrost/p2p/**/*
          - bifrost/metrics/**/*
          - common/**/*
          - constants/**/*
          - crypto/**/*
          - x/thorchain/ebifrost/**/*
          - x/thorchain/types/**/*
          # go-tss is excluded from unit-tests (TEST_PATHS), so a tss-lib bump in
          # go.mod would otherwise run no TSS tests at all.
          - go.mod
          - go.sum
  stage: test
  timeout: 1h
  needs: []
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
    - !reference [.stable-mtimes, before_script]
  script:
    - make test-go-tss
  artifacts:
    when: always
    reports:
      junit: test-quality-reports/root-mocknet-go-tss/junit.xml
    paths:
      - test-quality-reports/root-mocknet-go-tss/

pages:
  rules:
