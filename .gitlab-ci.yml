# Copy third-party images the dind jobs pull into this project's registry,
# registry to registry with `docker buildx imagetools`, so no dind daemon is
# involved. Running on protected branches only is not a registry ACL: any
# Developer's CI_JOB_TOKEN can push here too. So the copy is taken by the
# pinned digest, consumers pull by that digest, and a tag that points anywhere
# else is re-pointed.
mirror-ci-images:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  stage: build
  needs: []
  # consumers fall back to the upstream registry, so a failed copy only
  # costs reliability until the next protected pipeline
  allow_failure: true
  image: docker:28.5.2
  variables:
    DOCKER_HOST: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
  script:
    - mkdir -p ~/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > ~/.docker/config.json
    - |
      # mirror <source repo> <dest repo> <tag> <digest>
      mirror() {
        _have=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$2:$3" 2>/dev/null || true)
        if [ "$_have" = "$4" ]; then
          echo "$2:$3 already mirrored at $4"
          return
        fi
        [ -z "$_have" ] || echo "$2:$3 is $_have, not $4; re-pointing it"
        docker buildx imagetools create --tag "$2:$3" "$1:$3@$4"
      }
      PROTO_VER=$(sed -n 's/^protoVer=//p' Makefile)
      PROTO_DIGEST=$(sed -n 's/^protoDigest=//p' Makefile)
      mirror ghcr.io/cosmos/proto-builder "$CI_REGISTRY_IMAGE/ci/proto-builder" "$PROTO_VER" "$PROTO_DIGEST"

# Build the dind jobs' tools image (ci/Dockerfile.ci-tools) when a push to the
# default branch changes its Dockerfile, or on demand from a web pipeline on a
# protected branch. Only default-branch pushes publish automatically: promoting
# the same Dockerfile to stagenet or mainnet, and API pipelines (where
# rules:changes is always true), would otherwise re-run it into the
# existing-tag error. It refuses to overwrite an existing tag, so a change must
# bump CI_TOOLS_VERSION. Any Developer's CI_JOB_TOKEN can push to this
# registry, so jobs must reference the image by the digest this job prints,
# never by tag alone.
build-ci-tools-image:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        - ci/Dockerfile.ci-tools
  stage: build
  needs: []
  <<: *use_dind
  # the plain docker image, so a broken or missing tools image can be rebuilt
  image: docker:28.5.2
  before_script:
    - !reference [.wait-for-dind, before_script]
    - !reference [.dind-registries, before_script]
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      VERSION=$(sed -n 's/^ENV CI_TOOLS_VERSION=//p' ci/Dockerfile.ci-tools)
      IMAGE="$CI_REGISTRY_IMAGE/ci/tools:$VERSION"
      if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
        echo "$IMAGE already exists; bump CI_TOOLS_VERSION in ci/Dockerfile.ci-tools to publish a change."
        exit 1
      fi
      docker build --pull --build-arg DOCKER_MIRROR -t "$IMAGE" - <ci/Dockerfile.ci-tools
      docker run --rm --entrypoint sh "$IMAGE" -c \
        'docker compose version && docker buildx version && go version && make --version && git --version && jq --version && python3 --version && protoc --version && bash --version'
      docker push "$IMAGE"
      echo "Pin jobs to: $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"

build-thorscan:
  rules: *build-thornode-rules
  stage: build
  <<: *use_dind
  before_script:
    - !reference [.wait-for-dind, before_script]
  script:
    - make thorscan-build
    - make thorscan-gitlab-push

build-events:
  rules: *build-thornode-rules
  stage: build
  <<: *use_dind
  variables:
    GO_PRIVATE_AUTH_REQUIRED: "1"
  before_script:
    - !reference [.wait-for-dind, before_script]
    - !reference [.go-private-auth, before_script]
  script:
    - make events-build
    - make events-gitlab-push

test-simulation:
  # Run the cluster sim in parallel by default. Override per-pipeline with a
  # PARALLELISM CI variable; capped at 12 by the sim's user-mnemonic count.
  # The swap, refund and ragnarok stages keep every slot busy at 4 (95% in
  # the swap stage), so 8 shortens them by about a third.
  variables:
    DOCKER_BUILDKIT: "1"
    PARALLELISM: "8"
    PKGS: python3
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  timeout: 2h
  needs: !reference [.long-test-gate, needs]
  # One retry only. Measured over 2026-09-21..27: a second attempt rescued 24
  # runs, a third only 5, while 46 chains failed all three attempts (~45m each)
  # because the failure was real. The retry reuses the recorded seed, so a
  # failure that passes on retry is still reproducible from seed.txt.
  retry:
    max: 1
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
      - stuck_pending_with_matching_runners
      - no_updates_running
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure
      - script_failure
    exit_codes:
      - 75
  stage: long-test
  # The Go binaries are built here, not in the dind daemon (see
  # test-simulation-cluster-native in the Makefile), with the runner's warm Go
  # caches. bookworm is the build stage of build/docker/Dockerfile, so the
  # binaries link against the glibc of the bookworm runtime they run on; the
  # default golang:1.26.10 is trixie. The module cache is warm, so like
  # unit-tests this only warns when no credential can read tss-lib-private.
  image: golang:1.26.10-bookworm
  services:
    - docker:28.5.2-dind
  artifacts:
    when: always
    name: $CI_JOB_NAME-$CI_COMMIT_REF_NAME
    paths:
      - ./logs/
      - ./test-quality-reports/simulation-run/
  environment:
    name: integration
  before_script:
    - !reference [.docker-cli-apt, before_script]
    - !reference [.wait-for-dind, before_script]
    - !reference [.go-private-auth, before_script]
    - !reference [.dind-registries, before_script]
  script:
    # This target builds Go binaries in the job container, so it does not
    # pull the Go builder image checked by .dind-registries. Keep using the
    # dependency proxy for its Docker base and L1 images when that check fails.
    - |
      if [ -z "${DOCKER_MIRROR:-}" ] && [ -n "$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX" ] &&
         docker buildx imagetools inspect "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/ubuntu:24.04" >/dev/null 2>&1; then
        export DOCKER_MIRROR="${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/"
      fi
    # Do not allow an inherited optional-XMR setting to bypass live coverage.
    - |
      mkdir -p test-quality-reports/simulation-run
      # Stable across job retries, distinct across pipelines. The first attempt
      # can always be reconstructed even if GitLab replaces retry artifacts.
      export RANDOM_SEED_HEX="${RANDOM_SEED_HEX:-$(printf '%s' "$CI_PIPELINE_ID:$CI_COMMIT_SHA:$CI_JOB_NAME" | sha256sum | cut -d' ' -f1)}"
      printf '%s\n' "$RANDOM_SEED_HEX" > test-quality-reports/simulation-run/seed.txt
      make test-simulation-cluster-native TEST_SIMULATION_REQUIRE_XMR=1
  # Expensive diagnostics are collected only after a failure. The seed artifact
  # is retained on success too, so a later flake can be reproduced.
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        echo "test-simulation passed; skipping failure diagnostics"
        exit 0
      fi
    # The events dump reads the chain from docker-thornode-1. When the job failed
    # before the cluster started (image pull, build, startup), thorscan only adds
    # "failed to get current height" and the job reads as a thornode outage. Print
    # the container state instead, which shows a real crash (exit code, OOM).
    - |
      running=$(docker inspect -f '{{.State.Running}}' docker-thornode-1 2>/dev/null || true)
      if [ "$running" = "true" ]; then
        make test-simulation-events || true
      else
        state=$(docker inspect -f 'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}}' docker-thornode-1 2>/dev/null) || state="never created"
        echo "skipping the events dump: docker-thornode-1 is not running ($state); see the script output above for the failure"
      fi
    - mkdir -p logs/xmr-debug
    - docker ps -a >./logs/ps.log 2>&1
    - |
      for name in $(docker ps --format '{{.Names}}'); do
        docker logs "$name" >"./logs/$name.log" 2>&1
      done
    - docker inspect docker-xmr-sim-helper-1 > logs/xmr-debug/xmr-sim-helper.inspect.json 2>&1 || true
    - docker image inspect "$(docker inspect -f '{{.Image}}' docker-xmr-sim-helper-1)" > logs/xmr-debug/xmr-sim-helper.image.json 2>&1 || true
    - |
      docker run --rm --network docker_default curlimages/curl:8.11.1 -sv \
        -H 'Authorization: Bearer xmr-sim-helper-mocknet-token' \
        http://xmr-sim-helper:8284/ \
        > logs/xmr-debug/root.txt 2>&1 || true
    - |
      docker run --rm --network docker_default curlimages/curl:8.11.1 -sv \
        -X POST http://xmr-sim-helper:8284/v1/monero/sim/balance \
        -H 'Authorization: Bearer xmr-sim-helper-mocknet-token' \
        -H 'Content-Type: application/json' \
        -d '{"spend_key_hex":"00"}' \
        > logs/xmr-debug/sim-balance.txt 2>&1 || true

unit-tests-race-bifrost:
  tags: !reference [.small-runner, tags]
  variables:
    PKGS: python3
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  # long-test, not test: the race detector makes this a ~35m job, and running it
  # alongside unit-tests and lint on the shared runner starved both of CPU --
  # unit-tests failed on localhost "context deadline exceeded" and lint hit its
  # 1h timeout at 3x its usual runtime. It still waits for unit-tests, which now
  # starts with the pipeline instead of after the protobuf stage.
  stage: long-test
  needs:
    - job: unit-tests
      optional: true
      artifacts: false
  timeout: 1h
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
    - !reference [.stable-mtimes, before_script]
  script:
    - make test-race-bifrost
  artifacts:
    when: always
    reports:
      junit: test-quality-reports/root-mocknet-race-bifrost/junit.xml
    paths:
      - test-quality-reports/root-mocknet-race-bifrost/

# Curated mutations fail when an assertion survives, an anchor changes, or a
# baseline cannot run. The runner owns the shared build lock and time budget.
security-mutations-fast:
  tags: !reference [.small-runner, tags]
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    # The observer baseline imports tss-lib-private, which fork MRs cannot fetch.
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_MERGE_REQUEST_PROJECT_PATH
      when: never
    - if: '$CI_MERGE_REQUEST_IID && $CI_PIPELINE_SOURCE != "schedule"'
      changes:
        paths:
          - bifrost/observer/**/*
          - bifrost/pkg/chainclients/shared/signing/**/*
          - common/**/*
          - x/thorchain/types/**/*
          - scripts/test-security-mutations*
          - build/scripts/tests/test_security_mutations.py
          - go.mod
          - go.sum
  stage: long-test
  needs:
    - job: unit-tests
      optional: true
      artifacts: false
  timeout: 40m
  variables:
    PKGS: python3 util-linux
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
  script:
    - python3 scripts/test-security-mutations.py --mode fast --budget-seconds 1800 --summary test-quality-reports/mutations-fast.json
  artifacts:
    when: always
    paths:
      - test-quality-reports/mutations-fast.json

consensus-determinism:
  tags: !reference [.small-runner, tags]
  rules: *rules
  stage: long-test
  needs:
    - job: unit-tests
      optional: true
      artifacts: false
  timeout: 25m
  variables:
    PKGS: util-linux
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
    - !reference [.stable-mtimes, before_script]
  script:
    - mkdir -p test-quality-reports
    - sh -c 'scripts/test-consensus-determinism.sh > test-quality-reports/consensus-determinism.log 2>&1; rc=$?; cat test-quality-reports/consensus-determinism.log; exit "$rc"'
  artifacts:
    when: always
    paths:
      - test-quality-reports/consensus-determinism.log

.security-fuzz-base:
  tags: !reference [.small-runner, tags]
  stage: long-test
  needs:
    - job: unit-tests
      optional: true
      artifacts: false
  variables:
    PKGS: util-linux
    FUZZ_CORPUS_DIR: "$CI_PROJECT_DIR/.security-fuzz-corpus"
  # Each branch keeps its own corpus, seeded from the default branch's, so a
  # crasher saved by one branch is never replayed on another.
  cache:
    key: security-fuzz-corpus-v2-$CI_COMMIT_REF_SLUG
    fallback_keys:
      - security-fuzz-corpus-v2-$CI_DEFAULT_BRANCH
    paths:
      - .security-fuzz-corpus/
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
    - !reference [.stable-mtimes, before_script]
  script:
    - mkdir -p test-quality-reports
    - sh -c 'scripts/test-security-fuzz.sh > test-quality-reports/security-fuzz.log 2>&1; rc=$?; cat test-quality-reports/security-fuzz.log; exit "$rc"'
  artifacts:
    when: always
    paths:
      - test-quality-reports/security-fuzz.log
      # go test -fuzz writes failing inputs under the package's testdata/fuzz;
      # keep them so the logged rerun command has its reproducer.
      - x/thorchain/memo/testdata/fuzz/
      - common/testdata/fuzz/
      - bifrost/pkg/chainclients/solana/rpc/testdata/fuzz/
      - bifrost/p2p/messages/testdata/fuzz/

security-fuzz-fast:
  extends: .security-fuzz-base
  rules: *rules
  timeout: 25m
  variables:
    FUZZ_TIME: 1000x
    FUZZ_CORPUS_DIR: "$CI_PROJECT_DIR/.security-fuzz-corpus"

security-fuzz-deep:
  extends: .security-fuzz-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  timeout: 1h
  variables:
    FUZZ_TIME: 20s
    FUZZ_CORPUS_DIR: "$CI_PROJECT_DIR/.security-fuzz-corpus"

test-regression:
  tags: !reference [.small-runner, tags]
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train" && $CI_MERGE_REQUEST_TARGET_BRANCH_SHA == $CI_MERGE_REQUEST_DIFF_BASE_SHA'
      when: never
    - *rules
  retry:
    max: 2
    when:
      - runner_system_failure
      - runner_external_dependency_failure
      - runner_interrupted
      - api_failure
      - stuck_pending_with_matching_runners
      - no_updates_running
      - scheduler_failure
      - unknown_failure
      - data_integrity_failure
      - script_failure
    exit_codes:
      - 75
  stage: long-test
  timeout: 2h
  needs: !reference [.long-test-gate, needs]
  # Runs in the job container instead of building ci/Dockerfile.regtest in an
  # empty dind daemon, so the runner's warm /go-build-cache and /go-mod-cache
  # replace a cold `go mod download` and a cold compile of three binaries.
  # Each suite file gets its own home and ports (offset by file index), so
  # PARALLELISM cannot collide. The module cache is warm, so like unit-tests
  # this only warns when no credential can read tss-lib-private.
  # `make test-regression` still runs the same targets in docker for local use.
  environment:
    name: integration
  variables:
    TIME_FACTOR: "2"
    PARALLELISM: "10"
    FAIL_FAST: "true"
    PKGS: jq
    REGTEST_BIN_DIR: /tmp/regtest-bin
    REGTEST_HOME_BASE: /tmp/regtest-home
    REGTEST_MNT_DIR: $CI_PROJECT_DIR/test/regression/mnt
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
  script:
    - make _build-test-regression
    - make _test-regression UID=0 GID=0
    - |
      CHANGES=$(git status --porcelain test/regression/mnt/exports/ test/regression/mnt/blocks/)
      if [ -n "$CHANGES" ]; then
        echo "Detected uncommitted regression test exports or blocks:"
        echo "$CHANGES"
        echo "Please run 'make test-regression' locally and commit the changes."
        exit 1
      fi

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# NOTE: The following included jobs have internal rule definitions that need to be
# overwritten for them to trigger on merge requests. We overwrite all with the default
# workflow rule set.

secret_detection:
  tags: !reference [.small-runner, tags]
  stage: test
  needs: []
  rules: *rules

semgrep:
  tags: !reference [.small-runner, tags]
  stage: test
  needs: []
  rules: *rules
  image: semgrep/semgrep:1.140.0
  # --error makes findings fail the job; the previous `|| true` meant this check
  # could never fail. Rules live in-repo (semgrep/) so no network fetch is needed.
  script:
    # --no-git-ignore: target discovery must not depend on git working inside the
    # image, otherwise a git error scans 0 files and still exits 0.
    - semgrep scan --config semgrep/ --no-git-ignore --error --metrics=off --gitlab-sast --output gl-sast-report.json .
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json

govulncheck:
  tags: !reference [.small-runner, tags]
  stage: test
  needs: []
  rules: *rules
  variables:
    PKGS: jq
  before_script:
    - !reference [.pkg-install, before_script]
    - !reference [.go-private-auth, before_script]
  script:
    # fails on reachable vulnerable symbols not accepted in .govulncheck-ignore
    - ./scripts/govulncheck.sh
