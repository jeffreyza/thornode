# The MR widget's "View app" button. huginn's visual-review service builds a
# review page for every open non-draft MR and publishes it to Cloudflare Pages
# at this URL (it also keeps the link at the top of the MR description). This
# job only records the deployment GitLab needs to show the button: no secrets,
# no checkout. The page appears a few minutes to an hour after a new head.
visual-review:
  tags: !reference [.small-runner, tags]
  stage: test
  needs: []
