type: env
key: EMISSION_CURVE
value: "1000000000000"
---
type: env
key: ENABLE_ADV_SWAP_QUEUE
value: "0"
---
type: env
key: ENABLE_MEMOLESS_OUTBOUND
value: "0"
---
type: env
key: MINIMUM_L1_OUTBOUND_FEE_USD
value: "0"
---
{{ template "default-state.yaml" }}
---
type: state
genesis:
  app_state:
    bank:
      balances:
        - address: {{ addr_module_asgard }}
          coins:
            - amount: "100000000000"
              denom: rune
    thorchain:
      liquidity_providers:
        - asset: ZEC.ZEC
          asset_address: {{ addr_zec_cat }}
          asset_deposit_value: "10000000000"
          last_add_height: "1"
          pending_asset: "0"
          pending_rune: "0"
          rune_address: {{ addr_thor_cat }}
          rune_deposit_value: "100000000000"
          units: "100000000000"
      pools:
        - LP_units: "100000000000"
          asset: ZEC.ZEC
          balance_asset: "10000000000"
          balance_rune: "100000000000"
          decimals: "8"
          pending_inbound_asset: "0"
          pending_inbound_rune: "0"
          status: Available
          synth_units: "0"
      network_fees:
        - chain: ZEC
          transaction_fee_rate: "10"
          transaction_size: "200"
      vaults:
        - block_height: "0"
          chains:
            - THOR
            - ZEC
          coins:
            - amount: "10000000000"
              asset: ZEC.ZEC
              decimals: "8"
          inbound_tx_count: "1"
          membership:
            - {{ pubkey_dog }}
          pub_key: {{ pubkey_dog }}
          status: ActiveVault
          type: AsgardVault
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pool/ZEC.ZEC
asserts:
  - .balance_rune == "100000000000"
  - .balance_asset == "10000000000"
---
# Mocknet's textest/tm pair exercises the same conversion as mainnet's tex/t1.
type: tx-deposit
signer: {{ addr_thor_fox }}
coins:
  - amount: "10000000000"
    asset: rune
memo: "=:ZEC.ZEC:{{ addr_zec_fox_tex }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - length == 1
  - .[0].chain == "ZEC"
  - .[0].in_hash == "{{ native_txid 1 }}"
  - .[0].vault_pub_key == "{{ pubkey_dog }}"
  - .[0].to_address == "{{ addr_zec_fox }}"
  - .[0].to_address != "{{ addr_zec_fox_tex }}"
  - .[0].coin.asset == "ZEC.ZEC"
  - .[0].coin.amount == "${OUT_AMOUNT=826444280}"
  - .[0].max_gas[0].asset == "ZEC.ZEC"
  - .[0].max_gas[0].amount == "${MAX_GAS=3000}"
---
type: check
endpoint: http://localhost:1317/thorchain/tx/details/{{ native_txid 1 }}
asserts:
  - .tx.tx.memo == "=:ZEC.ZEC:{{ addr_zec_fox_tex }}"
  - .actions | length == 1
  - .actions[0].to_address == "{{ addr_zec_fox }}"
  - .actions[0].coin.amount == "${OUT_AMOUNT}"
---
# Clout credited to the TEX destination lands on the transparent address.
type: check
endpoint: http://localhost:1317/thorchain/clout/swap/{{ addr_zec_fox }}
asserts:
  - .address == "{{ addr_zec_fox }}"
  - .score == "${CLOUT=495495495}"
---
type: check
endpoint: http://localhost:1317/thorchain/clout/swap/{{ addr_zec_fox_tex }}
asserts:
  - .address == "{{ addr_zec_fox }}"
  - .score == "${CLOUT}"
---
# Bifrost observes the equivalent transparent address, not the submitted TEX.
type: tx-observed-out
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: ZEC
      from_address: {{ addr_zec_dog }}
      to_address: {{ addr_zec_fox }}
      coins:
        - amount: "${OUT_AMOUNT}"
          asset: ZEC.ZEC
          decimals: 8
      gas:
        - amount: "${MAX_GAS}"
          asset: ZEC.ZEC
      memo: "OUT:{{ native_txid 1 }}"
    block_height: 2
    finalise_height: 2
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/tx/details/{{ native_txid 1 }}
asserts:
  - .tx.status == "done"
  - .out_txs | length == 1
  - .out_txs[0].id == "{{ observe_txid 1 }}"
  - .out_txs[0].to_address == "{{ addr_zec_fox }}"
---
type: check
endpoint: http://localhost:1317/thorchain/tx/stages/{{ native_txid 1 }}
asserts:
  - .outbound_signed.completed == true
---
type: check
endpoint: http://localhost:1317/thorchain/node/{{ addr_thor_dog }}
asserts:
  - .total_bond == "5000000000000"
  - .slash_points == 0
