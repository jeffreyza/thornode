########################################################################################
# Rapid Swap Failed Market Budget
# Verifies a failed market swap on rapid iteration 1+ consumes MaxSwapsPerBlock
# budget, so a lower-priority swap behind it does not execute in the same block.
########################################################################################

type: env
key: L1_SLIP_MIN_BPS
value: "50"
---
{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: EnableAdvSwapQueue
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: AdvSwapQueueRapidSwapMax
value: 3
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: MinSwapsPerBlock
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: MaxSwapsPerBlock
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# TXID_1 (BTC->RUNE) is the highest-fee swap and takes iteration 0's only slot.
# On iteration 1 it is direction-skipped, leaving TXID_2 (ETH->RUNE, unreachable
# limit) as the highest-fee candidate. TXID_2 fails and must consume the slot,
# so the lower-fee TXID_3 (ETH->RUNE, no limit) does not execute this block.
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "${TXID_1={{ observe_txid 1 }}}"
      chain: BTC
      from_address: {{ addr_btc_fox }}
      to_address: {{ addr_btc_dog }}
      coins:
        - amount: "10000000"
          asset: "BTC.BTC"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "BTC.BTC"
      memo: "=:THOR.RUNE:{{ addr_thor_fox }}"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
  - tx:
      id: "${TXID_2={{ observe_txid 2 }}}"
      chain: ETH
      from_address: {{ addr_eth_fox }}
      to_address: {{ addr_eth_dog }}
      coins:
        - amount: "50000000"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "960000"
          asset: "ETH.ETH"
      memo: "=:THOR.RUNE:{{ addr_thor_fox }}:999999999999999999"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
  - tx:
      id: "${TXID_3={{ observe_txid 3 }}}"
      chain: ETH
      from_address: {{ addr_eth_fox }}
      to_address: {{ addr_eth_dog }}
      coins:
        - amount: "10000000"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "960000"
          asset: "ETH.ETH"
      memo: "=:THOR.RUNE:{{ addr_thor_fox }}"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap/details/${TXID_1}
asserts:
  - .swap.state.count == 1
  - .swap.state.failed_swaps|length == 0
---
# Iteration 1+ market failures consume budget without advancing state.
type: check
endpoint: http://localhost:1317/thorchain/queue/swap/details/${TXID_2}
asserts:
  - (.swap.state.count // 0) == 0
  - .swap.state.failed_swaps|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap/details/${TXID_3}
asserts:
  - (.swap.state.count // 0) == 0
  - .swap.state.in == "0"
---
# Lift the cap and let the queue drain.
type: tx-mimir
key: MaxSwapsPerBlock
value: 100
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 30
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - .|length == 0
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/asgard
asserts:
  - .broken == false
