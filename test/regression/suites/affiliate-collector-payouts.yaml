type: env
key: TNS_REGISTER_FEE
value: 100000000
---
{{ template "default-state.yaml" }}
---
{{ template "btc-eth-pool-state.yaml" }}
---
type: create-blocks
count: 1
---
# Same owner and preferred asset, but different partner payout addresses.
# A low multiplier triggers independent preferred payouts for both partners.
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "200000000"
    asset: "rune"
memo: "~:few:THOR:{{ addr_thor_cat }}:{{ addr_thor_cat }}:BTC.BTC::1"
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "0"
    asset: "rune"
memo: "~:few:BTC:{{ addr_btc_cat }}"
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "200000000"
    asset: "rune"
memo: "~:tan:THOR:{{ addr_thor_cat }}:{{ addr_thor_cat }}:BTC.BTC::1"
---
type: create-blocks
count: 1
---
type: tx-deposit
signer: {{ addr_thor_cat }}
coins:
  - amount: "0"
    asset: "rune"
memo: "~:tan:BTC:{{ addr_btc_pig }}"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/few
asserts:
  - .owner == "{{ addr_thor_cat }}"
  - .affiliate_collector_rune == "0"
  - .aliases[1].address == "{{ addr_btc_cat }}"
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/tan
asserts:
  - .owner == "{{ addr_thor_cat }}"
  - .affiliate_collector_rune == "0"
  - .aliases[1].address == "{{ addr_btc_pig }}"
---
# Exercise preferred payouts through swap queue V1.
type: tx-mimir
key: EnableAdvSwapQueue
value: 0
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: AdvSwapQueueRapidSwapMax
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 1 }}"
      chain: ETH
      from_address: {{ addr_eth_fox }}
      to_address: {{ addr_eth_dog }}
      coins:
        - amount: "100000000"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "ETH.ETH"
      memo: "=:THOR.RUNE:{{ addr_thor_fox }}::few/tan:100/200"
    block_height: 1
    finalise_height: 1
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - '[.[] | select(.tx.memo | startswith("THOR-PREFERRED-ASSET-"))] | length == 2'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")][0].tx.coins[0].amount == "82647710"'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-tan")][0].tx.coins[0].amount == "165295420"'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")][0].destination == "{{ addr_btc_cat }}"'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-tan")][0].destination == "{{ addr_btc_pig }}"'
---
type: create-blocks
count: 2
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - '[.[] | select(.coin.asset == "BTC.BTC")] | length == 2'
  - '[.[] | select(.to_address == "{{ addr_btc_cat }}")] | length == 1'
  - '[.[] | select(.to_address == "{{ addr_btc_pig }}")] | length == 1'
  - '[.[] | select(.coin.asset == "BTC.BTC") | (.coin.amount | tonumber)] | all(. > 0)'
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - '[.[] | select(.to_address == "{{ addr_btc_cat }}") | (.coin.amount | tonumber)] | sort == [75248]'
  - '[.[] | select(.to_address == "{{ addr_btc_pig }}") | (.coin.amount | tonumber)] | sort == [157744]'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/few
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/tan
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/affiliate_collector
asserts:
  - '.broken == false'
---
# Admit a FEW payout while BTC is live, then halt its execution.
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 2 }}"
      chain: ETH
      from_address: {{ addr_eth_fox }}
      to_address: {{ addr_eth_dog }}
      coins:
        - amount: "100000000"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "ETH.ETH"
      memo: "=:THOR.RUNE:{{ addr_thor_fox }}::few:500"
    block_height: 2
    finalise_height: 2
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")] | length == 1'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")][0].tx.coins[0].amount == "350277346"'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/few
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: tx-mimir
key: HaltBTCTrading
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# V1 rejects the halted swap and restores its full principal, without a fee.
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - '[.[] | select(.tx.memo | startswith("THOR-PREFERRED-ASSET-"))] | length == 0'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/few
asserts:
  - '.affiliate_collector_rune == "350277346"'
---
type: check
endpoint: http://localhost:1317/thorchain/balance/module/affiliate_collector
asserts:
  - '.coins[] | select(.denom == "rune") | .amount == "350277346"'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/tan
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/affiliate_collector
asserts:
  - '.broken == false'
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - '[.[] | select(.coin.asset == "BTC.BTC")] | length == 2'
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/few
asserts:
  - '.affiliate_collector_rune == "350277346"'
---
type: check
endpoint: http://localhost:1317/thorchain/balance/module/affiliate_collector
asserts:
  - '.coins[] | select(.denom == "rune") | .amount == "350277346"'
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/affiliate_collector
asserts:
  - '.broken == false'
---
# Exercise preferred payouts through swap queue V2.
type: tx-mimir
key: EnableAdvSwapQueue
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-mimir
key: HaltBTCTrading
value: 0
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 3 }}"
      chain: ETH
      from_address: {{ addr_eth_fox }}
      to_address: {{ addr_eth_dog }}
      coins:
        - amount: "100000000"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "ETH.ETH"
      memo: "=:THOR.RUNE:{{ addr_thor_fox }}::few/tan:100/200"
    block_height: 3
    finalise_height: 3
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - '[.[] | select(.tx.memo | startswith("THOR-PREFERRED-ASSET-"))] | length == 2'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")][0].tx.coins[0].amount == "410407274"'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-tan")][0].tx.coins[0].amount == "120259856"'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")][0].destination == "{{ addr_btc_cat }}"'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-tan")][0].destination == "{{ addr_btc_pig }}"'
---
type: create-blocks
count: 2
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - '[.[] | select(.coin.asset == "BTC.BTC")] | length == 4'
  - '[.[] | select(.to_address == "{{ addr_btc_cat }}")] | length == 2'
  - '[.[] | select(.to_address == "{{ addr_btc_pig }}")] | length == 2'
  - '[.[] | select(.coin.asset == "BTC.BTC") | (.coin.amount | tonumber)] | all(. > 0)'
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - '[.[] | select(.to_address == "{{ addr_btc_cat }}") | (.coin.amount | tonumber)] | sort == [75248,398140]'
  - '[.[] | select(.to_address == "{{ addr_btc_pig }}") | (.coin.amount | tonumber)] | sort == [111454,157744]'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/few
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/tan
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/affiliate_collector
asserts:
  - '.broken == false'
---
# Admit a FEW payout while BTC is live, then halt its execution.
type: tx-observed-in
signer: {{ addr_thor_dog }}
txs:
  - tx:
      id: "{{ observe_txid 4 }}"
      chain: ETH
      from_address: {{ addr_eth_fox }}
      to_address: {{ addr_eth_dog }}
      coins:
        - amount: "100000000"
          asset: "ETH.ETH"
          decimals: 8
      gas:
        - amount: "10000"
          asset: "ETH.ETH"
      memo: "=:THOR.RUNE:{{ addr_thor_fox }}::few:500"
    block_height: 4
    finalise_height: 4
    observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")] | length == 1'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")][0].tx.coins[0].amount == "260841182"'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/few
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: tx-mimir
key: HaltBTCTrading
value: 2
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
# V2 pauses halted swaps before execution, keeping the same claim queued.
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")] | length == 1'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")][0].tx.coins[0].amount == "260841182"'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/few
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/tan
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/affiliate_collector
asserts:
  - '.broken == false'
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")] | length == 1'
  - '[.[] | select(.tx.memo == "THOR-PREFERRED-ASSET-few")][0].tx.coins[0].amount == "260841182"'
---
type: tx-mimir
key: HaltBTCTrading
value: 0
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 2
---
type: check
endpoint: http://localhost:1317/thorchain/queue/swap
asserts:
  - 'length == 0'
---
type: check
endpoint: http://localhost:1317/thorchain/queue/outbound
asserts:
  - '[.[] | select(.coin.asset == "BTC.BTC")] | length == 5'
  - '[.[] | select(.to_address == "{{ addr_btc_cat }}")] | length == 3'
  - '[.[] | select(.to_address == "{{ addr_btc_pig }}")] | length == 2'
---
type: check
endpoint: http://localhost:1317/thorchain/thorname/few
asserts:
  - '.affiliate_collector_rune == "0"'
---
type: check
endpoint: http://localhost:1317/thorchain/invariant/affiliate_collector
asserts:
  - '.broken == false'
