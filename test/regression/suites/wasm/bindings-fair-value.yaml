---
type: create-blocks
count: 1
---
type: tx-mimir
key: WasmPermissionless
value: 1
signer: {{ addr_thor_dog }}
---
type: create-blocks
count: 1
---
type: tx-store-code
sender: {{ addr_thor_dog }}
wasm_file: "bindings.wasm"
gas: 2000000
---
type: create-blocks
count: 1
---
type: tx-instantiate-contract
code_id: 1
msg: {}
label: "bindings"
sender: {{ addr_thor_dog }}
gas: 100000
---
type: create-blocks
count: 1
---
type: check
# Query payload here is a base64 encoding of the raw message bytes. This will be 100x easier with interchaintest
# Query here is base64(json({ path: "/types.Query/Pool", data: base64(proto(QueryPoolRequest {Asset: "BTC.BTC"})) }))
# data: CgdCVEMuQlRD
endpoint: http://localhost:1317/cosmwasm/wasm/v1/contract/tthor14hj2tavq8fpesdwxxcu44rty3hh90vhujrvcmstl4zr3txmfvw9sw58u9f/smart/eyJncnBjIjp7InBhdGgiOiIvdHlwZXMuUXVlcnkvUG9vbCIsImRhdGEiOiJDZ2RDVkVNdVFsUkQifX0=
asserts:
  # no oracle prices yet: the same bytes as bindings.yaml
  - .data == ""
---
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  - .lp_unit_fair_value_rune == null
  - .lp_unit_spot_value_rune == null
  - .lp_fair_spot_deviation_bps == null
  - .fair_value_oracle_price_rune == null
---
########################################################################################
# with oracle prices for BTC and RUNE the pool and the contract see the fair value
########################################################################################
# P = 100000 / 100 = 1000 RUNE per BTC = R/A: fair value == spot value
type: tx-price-feed
prices:
  BTC: "100000"
  RUNE: "100"
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/pool/BTC.BTC
asserts:
  # block rewards have grown R to 100005438228, so spot R/A drifted above P = 1000:
  # fair = 2 * sqrt(A * R * P) / L, spot = 2 * R / L; deviation ~0.27 bps truncates to 0
  - .lp_unit_fair_value_rune == "2.000054381540662008"
  - .lp_unit_fair_value_asset == "0.002000054381540662"
  - .lp_unit_spot_value_rune == "2.000108764560000000"
  - .lp_fair_spot_deviation_bps == "0"
  - .fair_value_oracle_price_rune == "1000.000000000000000000"
  - .lp_fair_value_overhang == null
---
type: check
endpoint: http://localhost:1317/thorchain/pools
asserts:
  - .|length == 1
  - .[0].lp_unit_fair_value_rune == "2.000054381540662008"
  - .[0].fair_value_oracle_price_rune == "1000.000000000000000000"
---
type: check
# the same /types.Query/Pool grpc query as above, now carrying fields 40-44
endpoint: http://localhost:1317/cosmwasm/wasm/v1/contract/tthor14hj2tavq8fpesdwxxcu44rty3hh90vhujrvcmstl4zr3txmfvw9sw58u9f/smart/eyJncnBjIjp7InBhdGgiOiIvdHlwZXMuUXVlcnkvUG9vbCIsImRhdGEiOiJDZ2RDVkVNdVFsUkQifX0=
asserts:
  - .data == ""
