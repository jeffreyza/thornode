{{ template "dash-window-fee" addr_thor_pig }}
---
{{ template "btc-window-fee" addr_thor_pig }}
---
{{ template "dash-window-solvency" addr_thor_pig }}
---
{{ template "dash-window-errata" addr_thor_pig }}
