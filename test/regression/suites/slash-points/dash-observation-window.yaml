{{ template "dash-window-errata" addr_thor_frog }}
---
# All four voters reach consensus at THORChain height 2.
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/nodes
asserts:
  - .[] | select(.node_address == "{{ addr_thor_cat }}") | .slash_points == 0
  - .[] | select(.node_address == "{{ addr_thor_goat }}") | .slash_points == 8
  - .[] | select(.node_address == "{{ addr_thor_hawk }}") | .slash_points == 8
---
type: create-blocks
count: 4
---
# Goat arrives at height 7: exactly the DASH deadline, after BTC's deadline.
{{ template "dash-window-fee" addr_thor_goat }}
---
{{ template "btc-window-fee" addr_thor_goat }}
---
{{ template "dash-window-solvency" addr_thor_goat }}
---
{{ template "dash-window-errata" addr_thor_goat }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/nodes
asserts:
  - .[] | select(.node_address == "{{ addr_thor_goat }}") | .slash_points == 2
  - .[] | select(.node_address == "{{ addr_thor_hawk }}") | .slash_points == 8
---
# Hawk arrives at height 8: outside both windows, so no penalty is refunded.
{{ template "dash-window-fee" addr_thor_hawk }}
---
{{ template "btc-window-fee" addr_thor_hawk }}
---
{{ template "dash-window-solvency" addr_thor_hawk }}
---
{{ template "dash-window-errata" addr_thor_hawk }}
---
type: create-blocks
count: 1
---
type: check
endpoint: http://localhost:1317/thorchain/nodes
asserts:
  - .[] | select(.node_address == "{{ addr_thor_goat }}") | .slash_points == 2
  - .[] | select(.node_address == "{{ addr_thor_hawk }}") | .slash_points == 8
