# Reuse the same reports for each signer. BTC is the global-window control.
# Each signer sends four transactions before a block, so set their sequences explicitly.
{{ define "dash-window-fee" }}
type: tx-network-fee
signer: {{ . }}
sequence: 0
block_height: 100
chain: DASH
transaction_size: 2000
transaction_rate: 2
{{ end }}
{{ define "btc-window-fee" }}
type: tx-network-fee
signer: {{ . }}
sequence: 1
block_height: 100
chain: BTC
transaction_size: 2000
transaction_rate: 2
{{ end }}
{{ define "dash-window-solvency" }}
type: tx-solvency
signer: {{ . }}
sequence: 2
chain: DASH
pub_key: {{ pubkey_dog }}
coins:
  - asset: DASH.DASH
    amount: "100000000"
    decimals: 8
height: 100
{{ end }}
{{ define "dash-window-errata" }}
type: tx-errata-tx
signer: {{ . }}
sequence: 3
tx_id: "{{ observe_txid 1 }}"
chain: DASH
{{ end }}
{{ template "6-validators-btc-eth-pool-state.yaml" }}
---
type: state
genesis:
  app_state:
    thorchain:
      mimirs:
        - key: ObservationDelayFlexibility
          value: "2"
        - key: ObservationDelayFlexibilityDASH
          value: "5"
        - key: MissingObservationGuardBps
          value: "10000"
        - key: StopSolvencyCheck
          value: "1"
      # A known inbound without consensus lets errata reach quorum without
      # reversing funds. This suite tests observation credit, not reversals.
      observed_tx_in_voters:
        - tx_id: "{{ observe_txid 1 }}"
          txs:
            - tx:
                id: "{{ observe_txid 1 }}"
                chain: DASH
                from_address: {{ addr_dash_fox }}
                to_address: {{ addr_dash_dog }}
                coins:
                  - asset: DASH.DASH
                    amount: "100000000"
                    decimals: "8"
                gas:
                  - asset: DASH.DASH
                    amount: "1000"
                memo: NOOP
              block_height: "1"
              finalise_height: "1"
              observed_pub_key: {{ pubkey_dog }}
---
type: create-blocks
count: 1
---
{{ template "dash-window-fee" addr_thor_cat }}
---
{{ template "btc-window-fee" addr_thor_cat }}
---
{{ template "dash-window-solvency" addr_thor_cat }}
---
{{ template "dash-window-errata" addr_thor_cat }}
---
{{ template "dash-window-fee" addr_thor_fox }}
---
{{ template "btc-window-fee" addr_thor_fox }}
---
{{ template "dash-window-solvency" addr_thor_fox }}
---
{{ template "dash-window-errata" addr_thor_fox }}
